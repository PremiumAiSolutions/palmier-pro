name: Build Windows Installer

on:
  push:
    branches: [claude/practical-bell-b5v1tu]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crossplatform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalmierPro-Windows
          path: |
            crossplatform/release/*.exe
            crossplatform/release/*.zip
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build
          name: PalmierPro for Windows
          body: |
            PalmierPro for Windows.

            EASIEST (avoids the browser virus warning):
            download the .zip, right-click -> Extract All, then run PalmierPro.exe inside.

            Or use the .exe installer. Both are unsigned, so Windows may warn on first run -
            click "More info -> Run anyway".
          files: |
            crossplatform/release/*.exe
            crossplatform/release/*.zip
